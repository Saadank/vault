<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: #252535; --accent: #c8f55a; --red: #f55a5a;
    --text: #e8e8f0; --muted: #6b6b8a;
    --font-display: 'Syne', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font-display); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(200,245,90,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(200,245,90,0.03) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none;
  }
  .card {
    position: relative; background: var(--surface);
    border: 1px solid var(--border); padding: 48px 40px;
    width: 420px; max-width: 95vw;
    animation: fadeUp 0.4s ease both;
  }
  .logo { font-size: 28px; font-weight: 800; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 4px; }
  .logo-sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 36px; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-family: var(--font-mono); }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 11px 14px; font-family: var(--font-mono);
    font-size: 14px; outline: none; transition: border-color 0.2s; border-radius: 0;
  }
  input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; padding: 13px; background: var(--accent); color: var(--bg);
    border: none; font-family: var(--font-display); font-size: 14px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    transition: opacity 0.2s; margin-top: 8px;
  }
  .btn:hover { opacity: 0.88; }
  .link { text-align: center; margin-top: 20px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .link a { color: var(--accent); text-decoration: none; }
  .link a:hover { text-decoration: underline; }
  .error-msg {
    background: rgba(245,90,90,0.1); border: 1px solid var(--red);
    color: var(--red); padding: 10px 14px; font-family: var(--font-mono);
    font-size: 12px; margin-bottom: 18px; display: none;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">VAULT</div>
  <div class="logo-sub">PORTFOLIO MANAGER — SIGN IN</div>
  <div class="error-msg" id="error-msg"></div>
  <form id="login-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submit-btn">Sign In</button>
  </form>
  <div class="link">No account? <a href="/register">Create one</a></div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  errEl.style.display = 'none';

  const body = new URLSearchParams({
    username: document.getElementById('username').value,
    password: document.getElementById('password').value,
  });

  try {
    const res = await fetch('/api/auth/login', { method: 'POST', body, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
    if (res.ok) {
      const data = await res.json();
      // Store token for API calls; cookie also set by server
      localStorage.setItem('vault_token', data.access_token);
      window.location.href = '/dashboard';
    } else {
      const err = await res.json();
      errEl.textContent = err.detail || 'Login failed.';
      errEl.style.display = 'block';
    }
  } catch {
    errEl.textContent = 'Network error.';
    errEl.style.display = 'block';
  }

  btn.textContent = 'Sign In';
  btn.disabled = false;
});
</script>
</body>
</html>
