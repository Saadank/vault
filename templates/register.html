<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f;--surface:#12121a;--border:#252535;--accent:#c8f55a;--red:#f55a5a;
    --text:#e8e8f0;--muted:#6b6b8a;--font-display:'Syne',sans-serif;--font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-display);min-height:100vh;display:flex;align-items:center;justify-content:center;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,245,90,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,245,90,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
  .card{position:relative;background:var(--surface);border:1px solid var(--border);padding:48px 40px;width:440px;max-width:95vw;animation:fadeUp 0.4s ease both;}
  .logo{font-size:28px;font-weight:800;letter-spacing:0.15em;color:var(--accent);margin-bottom:4px;}
  .logo-sub{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:0.1em;margin-bottom:36px;}
  .form-group{margin-bottom:16px;}
  label{display:block;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-family:var(--font-mono);}
  input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;font-family:var(--font-mono);font-size:14px;outline:none;transition:border-color 0.2s;border-radius:0;}
  input:focus{border-color:var(--accent);}
  .hint{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px;}
  .btn{width:100%;padding:13px;background:var(--accent);color:var(--bg);border:none;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;margin-top:8px;}
  .btn:hover{opacity:0.88;}
  .link{text-align:center;margin-top:20px;font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .link a{color:var(--accent);text-decoration:none;}
  .link a:hover{text-decoration:underline;}
  .error-msg,.success-msg{padding:10px 14px;font-family:var(--font-mono);font-size:12px;margin-bottom:18px;display:none;}
  .error-msg{background:rgba(245,90,90,0.1);border:1px solid var(--red);color:var(--red);}
  .success-msg{background:rgba(200,245,90,0.1);border:1px solid var(--accent);color:var(--accent);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">VAULT</div>
  <div class="logo-sub">CREATE YOUR ACCOUNT</div>
  <div class="error-msg" id="error-msg"></div>
  <div class="success-msg" id="success-msg"></div>
  <form id="reg-form">
    <div class="form-group">
      <label>Full Name (optional)</label>
      <input type="text" id="full_name" autocomplete="name">
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" autocomplete="username" required minlength="3">
      <div class="hint">Min. 3 characters</div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" autocomplete="new-password" required minlength="8">
      <div class="hint">Min. 8 characters</div>
    </div>
    <button type="submit" class="btn" id="submit-btn">Create Account</button>
  </form>
  <div class="link">Already have an account? <a href="/login">Sign in</a></div>
</div>

<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('error-msg');
  const okEl  = document.getElementById('success-msg');
  btn.textContent = 'Creating…'; btn.disabled = true;
  errEl.style.display = 'none'; okEl.style.display = 'none';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: document.getElementById('full_name').value || null,
        username:  document.getElementById('username').value,
        email:     document.getElementById('email').value,
        password:  document.getElementById('password').value,
      }),
    });
    if (res.ok) {
      okEl.textContent = 'Account created! Redirecting to login…';
      okEl.style.display = 'block';
      setTimeout(() => window.location.href = '/login', 1500);
    } else {
      const err = await res.json();
      errEl.textContent = err.detail || 'Registration failed.';
      errEl.style.display = 'block';
    }
  } catch {
    errEl.textContent = 'Network error.';
    errEl.style.display = 'block';
  }
  btn.textContent = 'Create Account'; btn.disabled = false;
});
</script>
</body>
</html>
